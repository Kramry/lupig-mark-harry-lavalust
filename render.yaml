services:
  - type: web
    name: lavalust-product-api
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: DB_DRIVER
        value: mysql
      - key: DB_HOST
        value: your_aiven_host
      - key: DB_PORT
        value: "3306"
      - key: DB_DATABASE
        value: your_database_name
      - key: DB_USERNAME
        value: your_db_user
      - key: DB_PASSWORD
        value: your_db_password
      - key: DB_CHARSET
        value: utf8mb4
      - key: APP_KEY
        generateValue: true

  - type: static
    name: lavalust-product-frontend
    rootDir: product-management-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_API_URL
        value: https://your-render-api-url
